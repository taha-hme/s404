name: CD — Build & Deploy S404

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_ref:
        description: 'Optional Git tag/SHA label for manual deploy or rollback (leave empty for current commit)'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: s404_ci
          POSTGRES_PASSWORD: s404_ci_password
          POSTGRES_DB: s404_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://s404_ci:s404_ci_password@127.0.0.1:5432/s404_ci?sslmode=disable
      SESSION_SECRET: ci-deploy-signing-secret-0123456789

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.deploy_ref || github.ref }}

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: TypeScript typecheck
        run: npm run lint

      - name: Run Drizzle PostgreSQL migrations
        run: npm run db:migrate

      - name: Run full test suite
        run: npm test

      - name: Build production frontend
        run: npm run build

  publish-container:
    needs: verify
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.deploy_ref || github.ref }}

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: meta
        run: |
          TAG="${{ github.event.inputs.deploy_ref || github.sha }}"
          IMAGE="ghcr.io/${{ github.repository }}"
          IMAGE_LOWER=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          echo "image=$IMAGE_LOWER" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest

  deploy-liara:
    needs: verify
    runs-on: ubuntu-latest
    if: ${{ secrets.LIARA_API_TOKEN != '' && secrets.LIARA_APP_NAME != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.deploy_ref || github.ref }}

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Liara CLI
        run: npm install -g @liara/cli

      - name: Deploy to Liara
        env:
          LIARA_API_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
        run: |
          liara deploy \
            --app "${{ secrets.LIARA_APP_NAME }}" \
            --platform docker \
            --port 3000 \
            --api-token "$LIARA_API_TOKEN"

  deploy-ssh-docker:
    needs: publish-container
    runs-on: ubuntu-latest
    if: ${{ secrets.SSH_HOST != '' && secrets.SSH_USER != '' && secrets.SSH_PRIVATE_KEY != '' }}

    steps:
      - name: Deploy container over SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          APP_DIR: ${{ secrets.SSH_APP_DIR || '/opt/s404' }}
          GHCR_IMAGE: ghcr.io/${{ github.repository }}
          IMAGE_TAG: ${{ needs.publish-container.outputs.image_tag }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

          IMAGE_LOWER=$(echo "$GHCR_IMAGE" | tr '[:upper:]' '[:lower:]')
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "${SSH_USER}@${SSH_HOST}" \
            "cd '$APP_DIR' && S404_IMAGE='${IMAGE_LOWER}:${IMAGE_TAG}' docker compose pull app && S404_IMAGE='${IMAGE_LOWER}:${IMAGE_TAG}' docker compose up -d --remove-orphans app"

  deploy-webhook:
    needs: publish-container
    runs-on: ubuntu-latest
    if: ${{ secrets.DEPLOY_WEBHOOK_URL != '' }}

    steps:
      - name: Trigger external PaaS deploy webhook
        run: |
          curl -fsSL -X POST "${{ secrets.DEPLOY_WEBHOOK_URL }}"
